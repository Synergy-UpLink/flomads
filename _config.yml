title: "The Flomads"
tagline: "noMADS going with the FLO"
description: "Two humans, one pirate hedgehog, and the open road — living full-time across the globe one petsit at a time."
url: "https://flomads.com"
baseurl: ""

author:
  name: "The Flomads"

# ── i18n ──────────────────────────────────────────────────────
languages: ["en", "es", "de", "fr", "pt"]
default_lang: "en"
exclude_from_localizations:
  - assets
  - _data
  - robots.txt
  - site.webmanifest
  - favicon.ico
  - favicon.svg
  - favicon-96x96.png
  - apple-touch-icon.png
  - web-app-manifest-192x192.png
  - web-app-manifest-512x512.png

# ── Build settings ─────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: pretty

# ── Exclude from build ─────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - node_modules/

# ── Plugins ────────────────────────────────────────────────────
plugins:
  - jekyll-multiple-languages-plugin
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Page defaults ──────────────────────────────────────────────
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "sit-with-us"
    values:
      sitemap: false
      robots: "noindex, nofollow"
