title: "The Flomads"
tagline: "noMADS going with the FLOw"
description: "Two humans and one pirate hedgehog living full-time across the globe one petsit at a time."
url: "https://flomads.com"
baseurl: ""

author: Jordan
name: "The Flomads"

# Collections
collections:
  blog:
    output: true
    permalink: /blog/:slug/
    sort_by: date
  articles:
    output: true
    permalink: /articles/:slug/
    sort_by: date

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "post"
      collection_label: "Blog"
      collection_path: "/blog/"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "post"
      collection_label: "Articles"
      collection_path: "/articles/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - node_modules/

# Plugins (safe for GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Atom feed for the blog collection.
# jekyll-feed always builds a feed for the built-in "posts" collection, which this
# site doesn't use, so that empty one is parked at /feed/posts.xml and the blog
# collection is published at /feed.xml. Entries per feed: feed.posts_limit (default 10).
feed:
  path: /feed/posts.xml
  collections:
    blog:
      path: /feed.xml
