# ── Home page ──────────────────────────────────────────────────
home:
  eyebrow: "⚓ desde 2020"
  headline_line1: "no<em>MADS</em>"
  headline_line2: "seguindo"
  headline_line3: "o <em>FLUxo</em>"
  sub: "Dois humanos, um ouriço pirata e a estrada aberta — viajando em tempo integral pelo mundo, uma estadia de animais de cada vez."
  strip_travelers: "🌍 Viajantes em tempo integral"
  strip_liveaboards: "⛵ Ex-moradores de barco"
  strip_petsitters: "🐾 TrustedHouseSitters"
  strip_finca: "🌿 Futuros agricultores na finca"
  what_title: "O que é um Flomad?"
  what_p1: "Nos chamávamos FLOating noMADS — duas pessoas que venderam a casa, se livraram das coisas e se mudaram para um veleiro. Hoje o barco está em terra, mas o espírito continua vivo: noMADS seguindo o FLUxo."
  what_p2: "Desde 2020, percorremos o planeta — cuidando de animais em troca de hospedagem, alugando tempo suficiente para realmente <em>viver</em> em algum lugar, e construindo lentamente rumo a uma base permanente em uma finca no Equador, onde cultivar alimentos, fazer coisas com as mãos e acolher a comunidade que sempre quisemos."
  what_p3: "Ao longo do caminho: pássaros, barcos, escultura em madeira, harmônica, drinques em terraços e um ouriço chamado Henry."
  stat_years: "Anos na estrada"
  stat_destinations: "Países e destinos"
  stat_hedgehog: "Ouriço pirata"
  stat_gnomes: "Gnomos deixados para trás"
  how_title: "Como fazemos"
  how_petsit_title: "Cuidado de animais"
  how_petsit_body: "Trocamos cuidados por hospedagem pelo TrustedHouseSitters. Cães, gatos, galinhas — amamos todos eles. Atualmente hospedados com um par de cães bagunceiros e adoráveis no interior da Inglaterra."
  how_rental_title: "Aluguéis de longa duração"
  how_rental_body: "Preferimos ficar tempo suficiente para encontrar o bom café, aprender os ritmos do bairro e nos sentir locais. Dois meses é o mínimo; mais tempo é melhor."
  how_sea_title: "Por mar (antes)"
  how_sea_body: "Passamos anos vivendo a bordo de um quéche Pearson 365, navegando pela costa da Flórida e passando todo o ano de 2024 nas Bahamas. O capítulo do barco está se fechando — mas o sal ainda está em nós."
  how_remote_title: "Trabalho remoto"
  how_remote_body: "Consultoria tecnológica, engenharia de software e o que a internet torna possível nos mantém financiados e móveis. Wi-fi é imprescindível; código de vestimenta, não."
  love_title: "Coisas que amamos"
  love_birding_title: "Observação de pássaros"
  love_birding_body: "Das aves costeiras das Bahamas aos pisco-de-peito-ruivo ingleses empoleirados em postes — os pássaros estão em todo lugar se você reduzir a velocidade o suficiente para olhar."
  love_carving_title: "Escultura em madeira e pedra"
  love_carving_body: "Um de nós esculpe gnomos, animais e figuras em madeira e pedra. Eles são deixados em cada estadia — pequenos presentes para a próxima pessoa que abrir o galpão do jardim."
  love_harmonica_title: "Harmônica"
  love_harmonica_body: "O outro está aprendendo. Devagar. Sem constância. Mas com grande entusiasmo."
  love_growing_title: "Cultivar"
  love_growing_body: "O jogo longo é uma finca — terra, solo, sementes e o tipo de autossuficiência que parece menos com preparação para o fim do mundo e mais com bom senso."
  love_rooftop_title: "Horas no terraço"
  love_rooftop_body: "Drinques em uma varanda, uma churrasqueira no parque ao entardecer, uma mesa do lado de fora de um mercado — é assim que gostamos de socializar. Ao ar livre, sempre."
  love_slowtravel_title: "Viagem lenta"
  love_slowtravel_body: "Não colecionamos carimbos no passaporte. Aprendemos para onde vai o sol à tarde e qual padaria abre primeiro."
  cta_heading: "Venha junto nessa viagem."
  cta_body: "Ainda não temos uma newsletter (ainda). Mas você pode descobrir onde estamos agora e o que estamos fazendo."

# ── About page ─────────────────────────────────────────────────
about:
  title: "Sobre os Flomads"
  eyebrow: "A Tripulação"
  subtitle: "Três almas. Estradas infinitas. Nenhum endereço fixo."
  origin_title: "Como começou"
  origin_p1: "Em 2020, duas pessoas se olharam, olharam para as suas coisas e decidiram que as contas não fechavam. O apartamento, o trajeto, o acúmulo — tudo apontava para algo sem importância. Então embalaram tudo no que cabia em bolsas, adquiriram um ouriço Beanie Baby pirata de considerável dignidade, e foram embora."
  origin_p2: "O primeiro capítulo foi no mar. Eles viveram a bordo de um quéche de 11 metros — uma embarcação robusta e ligeiramente teimosa que recompensava a paciência e punia a complacência. Aprenderam a ancorar, a se abastecer, a enrolar cabos corretamente e a valorizar o que significa ter um lar que também tem marés. As Bahamas em 2024 foram o ponto alto: águas rasas cristalinas, estrelas absurdas e mais aves costeiras do que se podia nomear antes do pôr do sol."
  origin_p3: "Quando o capítulo do barco terminou, a estrada continuou — Equador, Costa Rica, México, Vermont, de volta à Flórida, e agora Inglaterra. O ritmo é o mesmo: encontrar um lugar, ficar tempo suficiente para importar, e seguir em frente mais rico por isso."
  crew_title: "Conheça a Tripulação"
  navigator_title: "O Navegador"
  navigator_role: "Engenheiro de software · Consultor de tecnologia · Estudante de harmônica (em andamento)"
  navigator_body: "Duas décadas de engenharia de software, amor por resolver problemas na intersecção entre tecnologia e vida real, e um relacionamento contínuo com a harmônica que pode ser melhor descrito como \"otimista\". Mantém a tecnologia funcionando, os barcos em movimento e os itinerários flexíveis."
  henry_role: "Navegador-chefe · Oficial de Moral · Ouriço Pirata"
  henry_body: "Um Beanie Baby de caráter impecável e reputação temível. Henry cruzou oceanos, passou pela alfândega (filosoficamente falando) e traz um ar de autoridade marítima onde quer que seja postado. Não requer alimentação. Excelente para posar em fotos."
  admiral_title: "A Almirante"
  admiral_role: "Artista · Escultora · MXT · Companheira de 17 anos"
  admiral_body: "Onde há madeira ou pedra, eventualmente haverá um gnomo. A Almirante esculpe figuras em cada estadia e as deixa para trás — pequenas sentinelas vigiando jardins e estantes muito depois de os Flomads terem partido. Também excelente em julgar quando uma bebida na varanda é merecida (sempre)."
  history_title: "Onde estivemos"
  tl_2020_title: "Colorado Springs → A estrada"
  tl_2020_body: "O ponto de origem. Embalamos, partimos e nunca olhamos para trás."
  tl_ecuador_title: "Cuenca, Equador"
  tl_ecuador_body: "Cinco meses nos Andes. Aluguel de longa duração, trabalho remoto e o primeiro gosto sério de \"talvez pudéssemos viver aqui para sempre\"."
  tl_latam_title: "Costa Rica & México"
  tl_latam_body: "La Fortuna e Santa Maria de Dota na Costa Rica; Todos Santos, México. Selvas, vulcões e tacos excelentes."
  tl_liveaboard_title: "Os anos a bordo"
  tl_liveaboard_body: "A bordo de um quéche Pearson 365 na Flórida — ancoragens, marinas e aprendendo que o mar é o chefe. Vermont também foi visitado."
  tl_bahamas_title: "As Bahamas"
  tl_bahamas_body: "O ano inteiro. Berry Islands. Exumas. Águas rasas na cor de piscinas e céus que tornavam discussões irrelevantes."
  tl_florida_title: "Retorno à Flórida e transição"
  tl_florida_body: "Melbourne, FL duas vezes. A era do barco fecha; a era do cuidado de animais abre. Bolsas refeitas, perfil no TrustedHouseSitters polido."
  tl_england_title: "Inglaterra e além"
  tl_england_body: "Atualmente no interior da Inglaterra com dois excelentes cães e um pub da aldeia a distância a pé. Próximo capítulo: a definir."
  dream_title: "O jogo longo"
  dream_p1: "Os Flomads estão construindo rumo a algo. Não um retorno à estase, mas um tipo diferente de enraizamento — uma finca no Equador, terra para cultivar, uma base permanente que também pode ser uma comunidade. A cidadania equatoriana é o fio burocrático; a fazenda sustentável é o sonho por trás de tudo."
  dream_p2: "Enquanto isso, viajamos. Cuidamos dos animais dos outros e os tratamos como nossos. Deixamos pequenas figuras esculpidas em jardins. Estudamos pássaros com binóculos e escalas de harmônica com comprometimento variável. Bebemos em terraços, grelhamos em parques e ficamos tempo suficiente em cada lugar para ter um favorito."
  dream_p3: "Essa é a vida Flomad: não fugir de nada. Correr <em>em direção</em> a algo que fica mais interessante quanto mais nos aproximamos."

# ── Now page ───────────────────────────────────────────────────
now:
  title: "Agora"
  eyebrow: "📍 Atualizado em"
  subtitle: "Uma fotografia do que estamos fazendo, onde estamos e o que está em nossas mentes."
  whats_now: "O que é uma página Now?"
  where_title: "Onde estamos"
  where_highlight: "Albrighton, Shropshire, Inglaterra"
  where_p1: "Estamos num vilarejo no interior da Inglaterra para uma estadia que vai até o início de junho de 2026. Nossos protegidos: Trixie, um cruzamento de boxer com opinião sobre tudo, e Buddy, um vira-lata tipo labrador dourado que aperfeiçoou a arte do olhar lastimoso na hora das refeições. Chegamos no início de fevereiro e já estamos totalmente integrados aos ritmos da aldeia — o pub, o correio, a qualidade particular da luz da tarde através das sebes."
  where_p2: "A Inglaterra na passagem do inverno para a primavera é mais verde do que se esperaria e cinza de maneiras que são genuinamente belas. Os pássaros têm sido excelentes."
  working_title: "No que estamos trabalhando"
  working_consulting_title: "Consultoria tecnológica"
  working_consulting_body: "Um de nós mantém as luzes acesas com engenharia de software e consultoria tecnológica. Remote-first, amigável ao assíncrono, ocasionalmente barulhento sobre isso."
  working_carving_title: "Escultura"
  working_carving_body: "A Almirante trabalha em madeira — figuras e criaturas tomando forma lentamente na bancada. Pelo menos uma ficará aqui quando formos embora."
  working_planning_title: "Planejando o próximo capítulo"
  working_planning_body: "Estamos pesquisando o que vem depois da Inglaterra. O sonho da finca está sempre em segundo plano; a próxima estadia ou aluguel está em primeiro plano. Ambos requerem planilhas."
  into_title: "O que nos apaixona"
  into_learning_title: "🎵 Aprendendo"
  into_learning_body: "A harmônica. O progresso é… não linear. Os cães têm opiniões. Tocamos assim mesmo."
  into_watching_title: "🦜 Observando"
  into_watching_body: "Pássaros, principalmente. A Inglaterra tem pisco-de-peito-ruivos perturbadoramente amigáveis e gralhas perturbadoramente inteligentes."
  into_dreaming_title: "🌱 Sonhando"
  into_dreaming_body: "Design de finca — o que cresce bem no Equador, como a autossuficiência realmente se parece em pequena escala, que tipo de comunidade queremos construir."
  henry_title: "Status do Henry"
  henry_highlight: "Atualmente: recebendo visitas em Shropshire"
  henry_body: "Henry S. Pricklesworth III continua projetando autoridade e mantendo excelente postura. Fez as pazes com o clima inglês. Tem sentimentos fortes em relação aos cães, que mantém em privado. Seu tapa-olho permanece perfeitamente posicionado. Tudo bem."
  next_title: "O que vem a seguir"
  next_p1: "Partimos de Albrighton no início de junho de 2026. Depois: em aberto. Estamos pesando opções — outra estadia, um aluguel mais longo em algum lugar mais quente, ou algo em que ainda não pensamos. A beleza e o terror desta vida é que o \"próximo\" raramente está definido até que esteja."
  next_p2: "O Equador está sempre no horizonte. Sempre mais perto."
  updated_note: "Esta página foi atualizada pela última vez em"

