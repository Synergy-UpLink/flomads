# ── Home page ──────────────────────────────────────────────────
home:
  eyebrow: "⚓ seit 2020"
  headline_line1: "no<em>MADS</em>"
  headline_line2: "mit dem"
  headline_line3: "<em>FLUss</em> gehen"
  sub: "Zwei Menschen, ein Piraten-Igel und die offene Straße — wir reisen weltweit in Vollzeit, ein Haustiersitting nach dem anderen."
  strip_travelers: "🌍 Vollzeit-Reisende"
  strip_liveaboards: "⛵ Ehemalige Bootsbewohner"
  strip_petsitters: "🐾 TrustedHouseSitters"
  strip_finca: "🌿 Zukünftige Finca-Bauern"
  what_title: "Was ist ein Flomad?"
  what_p1: "Wir nannten uns FLOating noMADS — zwei Menschen, die ihr Haus verkauften, ihre Sachen losließen und auf ein Segelboot zogen. Heute liegt das Boot an Land, aber der Geist lebt weiter: noMADS im FLUss des Lebens."
  what_p2: "Seit 2020 bereisen wir die Welt — wir hüten Haustiere im Austausch für Unterkunft, mieten lange genug, um wirklich <em>irgendwo zu leben</em>, und bauen langsam auf eine dauerhafte Basis auf einer Finca in Ecuador hin, wo wir Lebensmittel anbauen, mit unseren Händen arbeiten und die Gemeinschaft aufbauen möchten, die wir uns immer gewünscht haben."
  what_p3: "Unterwegs: Vögel, Boote, Holzschnitzen, Mundharmonika-Übungen, Drinks auf Dachterrassen und ein Igel namens Henry."
  stat_years: "Jahre unterwegs"
  stat_destinations: "Länder & Ziele"
  stat_hedgehog: "Piraten-Igel"
  stat_gnomes: "Hinterlassene Gartenzwerge"
  how_title: "Wie wir es machen"
  how_petsit_title: "Haustiersitting"
  how_petsit_body: "Wir tauschen Fürsorge gegen Unterkunft über TrustedHouseSitters. Hunde, Katzen, Hühner — wir haben sie alle geliebt. Aktuell bei einem Paar zerzauster, liebenswürdiger Hunde auf dem englischen Land."
  how_rental_title: "Langzeitmieten"
  how_rental_body: "Wir bleiben lieber lang genug, um das gute Café zu finden, die Rhythmen der Nachbarschaft kennenzulernen und uns wie Einheimische zu fühlen. Zwei Monate sind das Minimum; länger ist besser."
  how_sea_title: "Zur See (früher)"
  how_sea_body: "Wir lebten jahrelang an Bord eines Pearson 365 Ketches und segelten die Küste Floridas und verbrachten das gesamte Jahr 2024 auf den Bahamas. Das Bootskapitel geht zu Ende — aber das Salz steckt noch in uns."
  how_remote_title: "Remote-Arbeit"
  how_remote_body: "Technologieberatung, Softwareentwicklung und was das Internet möglich macht, hält uns finanziert und mobil. WLAN ist Voraussetzung; Dresscode nicht."
  love_title: "Was wir lieben"
  love_birding_title: "Vogelbeobachtung"
  love_birding_body: "Von Watvögeln auf den Bahamas bis zu englischen Rotkehlchen auf Zaunpfählen — Vögel sind überall, wenn man langsam genug ist, um hinzuschauen."
  love_carving_title: "Holz- und Steinschnitzen"
  love_carving_body: "Einer von uns schnitzt Zwerge, Tiere und Figuren aus Holz und Stein. Sie bleiben bei jedem Aufenthalt zurück — kleine Geschenke für die nächste Person, die den Gartenschuppen öffnet."
  love_harmonica_title: "Mundharmonika"
  love_harmonica_body: "Der andere lernt. Langsam. Unbeständig. Aber mit großer Begeisterung."
  love_growing_title: "Anbauen"
  love_growing_body: "Das langfristige Ziel ist eine Finca — Land, Erde, Samen und die Art von Selbstversorgung, die weniger nach Vorratshaltung und mehr nach gesundem Menschenverstand klingt."
  love_rooftop_title: "Stunden auf der Dachterrasse"
  love_rooftop_body: "Drinks auf einer Terrasse, ein Grillabend im Park zur goldenen Stunde, ein Tisch vor einem Mercado — so mögen wir es, zu sozialisieren. Immer im Freien."
  love_slowtravel_title: "Langsames Reisen"
  love_slowtravel_body: "Wir sammeln keine Passstempel. Wir lernen, wohin die Sonne nachmittags geht und welche Bäckerei zuerst aufmacht."
  cta_heading: "Komm mit auf die Reise."
  cta_body: "Wir haben noch keinen Newsletter (noch nicht). Aber du kannst herausfinden, wo wir gerade sind und was wir treiben."

# ── About page ─────────────────────────────────────────────────
about:
  title: "Über die Flomads"
  eyebrow: "Die Crew"
  subtitle: "Drei Seelen. Endlose Wege. Keine feste Adresse."
  origin_title: "Wie alles begann"
  origin_p1: "Im Jahr 2020 schauten sich zwei Menschen an, schauten ihre Sachen an und entschieden, dass die Rechnung nicht aufging. Die Wohnung, der Arbeitsweg, das Anhäufen — es deutete alles auf etwas Bedeutungsloses hin. Also packten sie alles in das, was in Taschen passte, erwarben einen Piraten-Igel Beanie Baby von beachtlicher Würde und gingen."
  origin_p2: "Das erste Kapitel war auf dem Wasser. Sie lebten an Bord eines 11-Meter-Ketches — ein standhaftes, leicht eigensinniges Schiff, das Geduld belohnte und Selbstgefälligkeit bestrafte. Sie lernten zu ankern, zu proviantieren, Leinen richtig aufzuschießen und zu schätzen, was es bedeutet, ein Zuhause zu haben, das auch Gezeiten hat. Die Bahamas 2024 waren der Höhepunkt: spiegelglatte Flachwasser, unglaubliche Sterne und mehr Watvögel, als man vor Sonnenuntergang benennen konnte."
  origin_p3: "Als das Bootskapitel zu Ende ging, ging die Reise weiter — Ecuador, Costa Rica, Mexiko, Vermont, zurück nach Florida und jetzt England. Der Rhythmus ist immer gleich: einen Ort finden, lang genug bleiben, um bedeutsam zu sein, und bereichert weiterzuziehen."
  crew_title: "Die Crew"
  navigator_title: "Der Navigator"
  navigator_role: "Software-Ingenieur · Technologieberater · Mundharmonika-Schüler (laufend)"
  navigator_body: "Zwei Jahrzehnte Softwareentwicklung, eine Leidenschaft für das Lösen von Problemen an der Schnittstelle von Technologie und echtem Leben und eine anhaltende Beziehung zur Mundharmonika, die man am besten als \"optimistisch\" beschreibt. Hält die Technik am Laufen, die Boote in Bewegung und die Reisepläne flexibel."
  henry_role: "Chefnavigator · Moral-Offizier · Piraten-Igel"
  henry_body: "Ein Beanie Baby von untadeligem Charakter und gefürchtetem Ruf. Henry hat Ozeane überquert, den Zoll überstanden (philosophisch gesprochen) und bringt überall, wo er stationiert ist, eine maritime Autorität mit. Benötigt keine Fütterung. Exzellent beim Posieren für Fotos."
  admiral_title: "Die Admirälin"
  admiral_role: "Künstlerin · Schnitzerin · MXT · Partnerin seit 17 Jahren"
  admiral_body: "Wo Holz oder Stein ist, wird irgendwann ein Zwerg entstehen. Die Admirälin schnitzt bei jedem Aufenthalt Figuren und lässt sie zurück — kleine Wächter in Gärten und Bücherregalen, lange nachdem die Flomads weitergezogen sind. Auch ausgezeichnet darin zu beurteilen, wann ein Terrassendrink verdient ist (immer)."
  history_title: "Wo wir waren"
  tl_2020_title: "Colorado Springs → Die Straße"
  tl_2020_body: "Der Ausgangspunkt. Eingepackt, aufgebrochen und nie zurückgeblickt."
  tl_ecuador_title: "Cuenca, Ecuador"
  tl_ecuador_body: "Fünf Monate in den Anden. Langzeitmiete, Remote-Arbeit und der erste ernsthafte Vorgeschmack von \"vielleicht könnten wir hier für immer leben\"."
  tl_latam_title: "Costa Rica & Mexiko"
  tl_latam_body: "La Fortuna und Santa Maria de Dota in Costa Rica; Todos Santos, Mexiko. Dschungel, Vulkane und ausgezeichnete Tacos."
  tl_liveaboard_title: "Die Bord-Jahre"
  tl_liveaboard_body: "An Bord eines Pearson 365 Ketches in Florida — ankern, Marinas und lernen, dass das Meer das Sagen hat. Auch Vermont wurde besucht."
  tl_bahamas_title: "Die Bahamas"
  tl_bahamas_body: "Das ganze Jahr. Berry Islands. Exumas. Flachwasser in der Farbe von Schwimmbädern und Himmel, der Streitigkeiten irrelevant machte."
  tl_florida_title: "Rückkehr nach Florida & Übergang"
  tl_florida_body: "Melbourne, FL zweimal. Die Bootszeit endet; die Haustiersitting-Zeit beginnt. Taschen neu gepackt, TrustedHouseSitters-Profil aufpoliert."
  tl_england_title: "England & Weiter"
  tl_england_body: "Derzeit auf dem englischen Land mit zwei wunderbaren Hunden und einem Dorfpub in Gehweite. Nächstes Kapitel: offen."
  dream_title: "Das große Spiel"
  dream_p1: "Die Flomads bauen auf etwas hin. Nicht eine Rückkehr zur Stasis, sondern eine andere Art von Verwurzelung — eine Finca in Ecuador, Land zum Anbauen, eine permanente Basis, die auch eine Gemeinschaft sein kann. Die ecuadorianische Staatsbürgerschaft ist der bürokratische Faden; die nachhaltige Farm ist der Traum dahinter."
  dream_p2: "In der Zwischenzeit reisen wir. Wir hüten die Tiere anderer und behandeln sie wie unsere eigenen. Wir lassen kleine geschnitzte Figuren in Gärten zurück. Wir beobachten Vögel mit dem Fernglas und üben Mundharmonika-Skalen mit unterschiedlichem Engagement. Wir trinken auf Terrassen, grillen in Parks und bleiben lang genug an jedem Ort, um einen Lieblingsplatz zu haben."
  dream_p3: "Das ist das Flomad-Leben: nicht vor etwas weglaufen. Auf etwas <em>zulaufen</em>, das umso interessanter wird, je näher wir kommen."

# ── Now page ───────────────────────────────────────────────────
now:
  title: "Jetzt"
  eyebrow: "📍 Aktualisiert"
  subtitle: "Ein Schnappschuss dessen, was wir tun, wo wir sind und was uns beschäftigt."
  whats_now: "Was ist eine Now-Seite?"
  where_title: "Wo wir sind"
  where_highlight: "Albrighton, Shropshire, England"
  where_p1: "Wir sind in einem Dorf auf dem englischen Land für einen Aufenthalt bis Anfang Juni 2026. Unsere Schützlinge: Trixie, ein Boxer-Mix mit einer Meinung zu allem, und Buddy, ein Golden-Labrador-artiger Mischling, der die Kunst des mitleidigen Blicks zur Essenszeit perfektioniert hat. Wir kamen Anfang Februar an und haben uns vollständig in die Rhythmen des Dorfes eingelebt — den Pub, das Postamt, die besondere Qualität des Nachmittagslichts durch die Hecken."
  where_p2: "England im Übergang von Winter zu Frühling ist grüner als erwartet und grau auf eine Art, die tatsächlich schön ist. Die Vögel waren ausgezeichnet."
  working_title: "Woran wir arbeiten"
  working_consulting_title: "Technologieberatung"
  working_consulting_body: "Einer von uns hält die Lichter an mit Softwareentwicklung und Technologieberatung. Remote-first, asynchron-freundlich, gelegentlich lautstark darüber."
  working_carving_title: "Schnitzen"
  working_carving_body: "Die Admirälin arbeitet in Holz — Figuren und Kreaturen, die langsam auf der Werkbank Form annehmen. Mindestens eine wird hier zurückbleiben, wenn wir gehen."
  working_planning_title: "Das nächste Kapitel planen"
  working_planning_body: "Wir recherchieren, was nach England kommt. Der Finca-Traum ist immer im Hintergrund; der nächste Aufenthalt oder die nächste Miete ist im Vordergrund. Beides erfordert Tabellenkalkulationen."
  into_title: "Was uns begeistert"
  into_learning_title: "🎵 Lernen"
  into_learning_body: "Die Mundharmonika. Der Fortschritt ist… nicht linear. Die Hunde haben Meinungen. Wir spielen trotzdem."
  into_watching_title: "🦜 Beobachten"
  into_watching_body: "Vor allem Vögel. England hat erschreckend freundliche Rotkehlchen und erschreckend kluge Dohlen."
  into_dreaming_title: "🌱 Träumen"
  into_dreaming_body: "Finca-Design — was in Ecuador gut wächst, wie Selbstversorgung im kleinen Maßstab wirklich aussieht, welche Art von Gemeinschaft wir aufbauen wollen."
  henry_title: "Henrys Status"
  henry_highlight: "Derzeit: hält Hof in Shropshire"
  henry_body: "Henry S. Pricklesworth III projiziert weiterhin Autorität und hält ausgezeichnete Haltung. Er hat sich mit dem englischen Klima arrangiert. Er hat starke Gefühle gegenüber den Hunden, die er für sich behält. Seine Augenklappe sitzt perfekt. Alles ist gut."
  next_title: "Was als Nächstes kommt"
  next_p1: "Wir verlassen Albrighton Anfang Juni 2026. Danach: offen. Wir wägen Optionen ab — ein weiterer Aufenthalt, eine längere Miete irgendwo Wärmerem oder etwas, an das wir noch nicht gedacht haben. Das Schöne und Schreckliche an diesem Leben ist, dass das \"Nächste\" selten feststeht, bis es feststeht."
  next_p2: "Ecuador ist immer am Horizont. Immer näher."
  updated_note: "Diese Seite wurde zuletzt aktualisiert im"

