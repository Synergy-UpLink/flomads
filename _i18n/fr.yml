# ── Home page ──────────────────────────────────────────────────
home:
  eyebrow: "⚓ depuis 2020"
  headline_line1: "no<em>MADS</em>"
  headline_line2: "qui suivent"
  headline_line3: "le <em>FLUx</em>"
  sub: "Deux humains, un hérisson pirate et la route ouverte — voyageant à plein temps à travers le monde, un gardiennage à la fois."
  strip_travelers: "🌍 Voyageurs à temps plein"
  strip_liveaboards: "⛵ Ex-résidents sur bateau"
  strip_petsitters: "🐾 TrustedHouseSitters"
  strip_finca: "🌿 Futurs agriculteurs en finca"
  what_title: "C'est quoi un Flomad ?"
  what_p1: "Nous nous appelions FLOating noMADS — deux personnes qui ont vendu la maison, abandonné les affaires et emménagé sur un voilier. Aujourd'hui le bateau est à terre, mais l'esprit perdure : noMADS qui suivent le FLUx."
  what_p2: "Depuis 2020, nous sillonnons la planète — en gardant des animaux en échange d'un logement, en louant assez longtemps pour vraiment <em>vivre</em> quelque part, et en construisant lentement vers une base permanente dans une finca en Équateur où cultiver des aliments, travailler de nos mains et accueillir la communauté que nous avons toujours voulue."
  what_p3: "En chemin : des oiseaux, des bateaux, la sculpture sur bois, des notes d'harmonica, des apéros sur les toits et un hérisson nommé Henry."
  stat_years: "Ans sur la route"
  stat_destinations: "Pays et destinations"
  stat_hedgehog: "Hérisson pirate"
  stat_gnomes: "Gnomes laissés derrière"
  how_title: "Comment nous faisons"
  how_petsit_title: "Gardiennage"
  how_petsit_body: "Nous échangeons des soins contre un hébergement via TrustedHouseSitters. Chiens, chats, poules — nous les avons tous aimés. Actuellement avec deux chiens adorables et débraillés dans la campagne anglaise."
  how_rental_title: "Locations longue durée"
  how_rental_body: "Nous préférons rester assez longtemps pour trouver le bon café, apprendre les rythmes du quartier et nous sentir comme des locaux. Deux mois minimum ; plus longtemps, c'est mieux."
  how_sea_title: "Par mer (autrefois)"
  how_sea_body: "Nous avons passé des années à bord d'un ketch Pearson 365, à naviguer sur la côte de Floride et à passer toute l'année 2024 aux Bahamas. Le chapitre du bateau se ferme — mais le sel est toujours en nous."
  how_remote_title: "Travail à distance"
  how_remote_body: "Le conseil technologique, l'ingénierie logicielle et ce qu'internet rend possible nous garde financés et mobiles. Le wi-fi est indispensable ; le code vestimentaire, non."
  love_title: "Ce que nous aimons"
  love_birding_title: "Ornithologie"
  love_birding_body: "Des limicoles des Bahamas aux rouges-gorges anglais perchés sur des poteaux — les oiseaux sont partout si on ralentit assez pour regarder."
  love_carving_title: "Sculpture sur bois et pierre"
  love_carving_body: "L'un de nous sculpte des gnomes, des animaux et des figurines dans le bois et la pierre. Ils sont laissés à chaque séjour — de petits cadeaux pour la prochaine personne qui ouvre la remise du jardin."
  love_harmonica_title: "Harmonica"
  love_harmonica_body: "L'autre apprend. Lentement. Sans régularité. Mais avec beaucoup d'enthousiasme."
  love_growing_title: "Cultiver"
  love_growing_body: "Le jeu long, c'est une finca — de la terre, du sol, des graines et ce type d'autonomie qui ressemble moins à du survivalisme et plus au bon sens."
  love_rooftop_title: "Heures sur les toits"
  love_rooftop_body: "Des verres sur une terrasse, un barbecue dans un parc à l'heure dorée, une table devant un mercado — c'est ainsi que nous aimons socialiser. En plein air, toujours."
  love_slowtravel_title: "Voyage lent"
  love_slowtravel_body: "Nous ne collectionnons pas les tampons de passeport. Nous apprenons où va le soleil l'après-midi et quelle boulangerie ouvre en premier."
  cta_heading: "Venez avec nous."
  cta_body: "Nous n'avons pas encore de newsletter (pas encore). Mais vous pouvez savoir où nous sommes en ce moment et ce que nous faisons."

# ── About page ─────────────────────────────────────────────────
about:
  title: "À propos des Flomads"
  eyebrow: "L'équipage"
  subtitle: "Trois âmes. Des routes infinies. Aucune adresse fixe."
  origin_title: "Comment tout a commencé"
  origin_p1: "En 2020, deux personnes se sont regardées, ont regardé leurs affaires et ont décidé que le compte n'y était pas. L'appartement, le trajet, l'accumulation — tout pointait vers quelque chose d'anodin. Alors ils ont tout tassé dans ce qui tenait dans des sacs, ont acquis un hérisson Beanie Baby pirate d'une dignité considérable, et sont partis."
  origin_p2: "Le premier chapitre était en mer. Ils vivaient à bord d'un ketch de 11 mètres — un bateau solide et légèrement têtu qui récompensait la patience et punissait la complaisance. Ils ont appris à mouiller l'ancre, à s'approvisionner, à lover les cordages correctement et à apprécier ce que signifie avoir un foyer qui suit aussi les marées. Les Bahamas en 2024 furent l'apogée : des eaux peu profondes miroitantes, des étoiles incroyables et plus de limicoles qu'on ne pouvait en nommer avant le coucher du soleil."
  origin_p3: "Quand le chapitre du bateau s'est terminé, la route a continué — l'Équateur, le Costa Rica, le Mexique, le Vermont, retour en Floride, et maintenant l'Angleterre. Le rythme est le même : trouver un endroit, rester assez longtemps pour compter, puis repartir plus riche pour cela."
  crew_title: "Rencontrer l'équipage"
  navigator_title: "Le Navigateur"
  navigator_role: "Ingénieur logiciel · Consultant technologique · Élève en harmonica (en cours)"
  navigator_body: "Deux décennies d'ingénierie logicielle, un amour pour résoudre les problèmes à l'intersection de la technologie et de la vie réelle, et une relation en cours avec l'harmonica qu'on peut qualifier au mieux d'« optimiste ». Maintient la technologie en marche, les bateaux en mouvement et les itinéraires flexibles."
  henry_role: "Navigateur en chef · Officier moral · Hérisson pirate"
  henry_body: "Un Beanie Baby au caractère irréprochable et à la réputation redoutable. Henry a traversé des océans, survécu à la douane (philosophiquement parlant) et apporte un air d'autorité maritime partout où il est posté. Ne nécessite pas de nourriture. Excellent pour poser en photo."
  admiral_title: "L'Amiral"
  admiral_role: "Artiste · Sculptrice · MXT · Compagne depuis 17 ans"
  admiral_body: "Là où il y a du bois ou de la pierre, il y aura éventuellement un gnome. L'Amiral sculpte des figurines à chaque séjour et les laisse derrière — de petites sentinelles qui veillent sur des jardins et des étagères longtemps après que les Flomads soient partis. Aussi excellente pour juger quand un verre en terrasse s'impose (toujours)."
  history_title: "Où nous sommes allés"
  tl_2020_title: "Colorado Springs → La route"
  tl_2020_body: "Le point de départ. On a tout emballé, on est partis et on n'a jamais regardé en arrière."
  tl_ecuador_title: "Cuenca, Équateur"
  tl_ecuador_body: "Cinq mois dans les Andes. Location longue durée, travail à distance et le premier avant-goût sérieux de « peut-être qu'on pourrait vivre ici pour toujours »."
  tl_latam_title: "Costa Rica & Mexique"
  tl_latam_body: "La Fortuna et Santa Maria de Dota au Costa Rica ; Todos Santos, Mexique. Jungles, volcans et excellents tacos."
  tl_liveaboard_title: "Les années en mer"
  tl_liveaboard_body: "À bord d'un ketch Pearson 365 en Floride — mouillages, marinas et leçons sur l'autorité de la mer. Le Vermont a aussi reçu une visite."
  tl_bahamas_title: "Les Bahamas"
  tl_bahamas_body: "Toute l'année. Berry Islands. Exumas. Des eaux peu profondes couleur piscine et des ciels qui rendaient les disputes dérisoires."
  tl_florida_title: "Retour en Floride & transition"
  tl_florida_body: "Melbourne, FL deux fois. L'ère du bateau se ferme ; l'ère du gardiennage s'ouvre. Sacs refaits, profil TrustedHouseSitters peaufiné."
  tl_england_title: "L'Angleterre & au-delà"
  tl_england_body: "Actuellement dans la campagne anglaise avec deux excellents chiens et un pub de village à distance de marche. Prochain chapitre : à définir."
  dream_title: "Le grand jeu"
  dream_p1: "Les Flomads construisent vers quelque chose. Pas un retour à l'immobilité, mais un autre type d'enracinement — une finca en Équateur, de la terre pour cultiver, une base permanente qui peut aussi être une communauté. La citoyenneté équatorienne est le fil bureaucratique ; la ferme durable est le rêve derrière tout cela."
  dream_p2: "En attendant, nous voyageons. Nous gardons les animaux des autres et les traitons comme les nôtres. Nous laissons de petites figurines sculptées dans les jardins. Nous observons les oiseaux aux jumelles et pratiquons les gammes d'harmonica avec un engagement variable. Nous buvons en terrasse, grillons dans les parcs et restons assez longtemps dans chaque endroit pour avoir un préféré."
  dream_p3: "C'est la vie Flomad : ne pas fuir quelque chose. Courir <em>vers</em> quelque chose qui devient de plus en plus intéressant au fur et à mesure qu'on s'en approche."

# ── Now page ───────────────────────────────────────────────────
now:
  title: "Maintenant"
  eyebrow: "📍 Mis à jour en"
  subtitle: "Un instantané de ce que nous faisons, où nous sommes et ce que nous avons à l'esprit."
  whats_now: "C'est quoi une page Now ?"
  where_title: "Où nous sommes"
  where_highlight: "Albrighton, Shropshire, Angleterre"
  where_p1: "Nous sommes dans un village de la campagne anglaise pour un gardiennage qui dure jusqu'à début juin 2026. Nos protégés : Trixie, un croisé boxer avec un avis sur tout, et Buddy, un croisé labrador doré qui a perfectionné l'art du regard pitoyable aux repas. Nous sommes arrivés début février et nous nous sommes parfaitement intégrés aux rythmes du village — le pub, la poste, la qualité particulière de la lumière de l'après-midi à travers les haies."
  where_p2: "L'Angleterre au passage de l'hiver au printemps est plus verte qu'on ne l'imaginerait et grise d'une façon qui est en réalité belle. Les oiseaux ont été excellents."
  working_title: "Sur quoi nous travaillons"
  working_consulting_title: "Conseil technologique"
  working_consulting_body: "L'un de nous maintient les lumières allumées avec du développement logiciel et du conseil technologique. Remote-first, compatible avec l'asynchrone, parfois bruyant à ce sujet."
  working_carving_title: "Sculpture"
  working_carving_body: "L'Amiral travaille le bois — des figurines et des créatures prenant lentement forme sur l'établi. Au moins une sera laissée ici quand nous partirons."
  working_planning_title: "Planifier le prochain chapitre"
  working_planning_body: "Nous recherchons ce qui vient après l'Angleterre. Le rêve de la finca est toujours en arrière-plan ; le prochain séjour ou la prochaine location est au premier plan. Les deux nécessitent des tableurs."
  into_title: "Ce qui nous passionne"
  into_learning_title: "🎵 Apprendre"
  into_learning_body: "L'harmonica. Les progrès sont… non linéaires. Les chiens ont des opinions. On joue quand même."
  into_watching_title: "🦜 Observer"
  into_watching_body: "Les oiseaux, surtout. L'Angleterre a des rouges-gorges étrangement amicaux et des choucas étrangement intelligents."
  into_dreaming_title: "🌱 Rêver"
  into_dreaming_body: "La conception de la finca — ce qui pousse bien en Équateur, à quoi ressemble vraiment l'autonomie à petite échelle, quel type de communauté nous voulons construire."
  henry_title: "Statut d'Henry"
  henry_highlight: "En ce moment : tient cour dans le Shropshire"
  henry_body: "Henry S. Pricklesworth III continue de projeter autorité et de maintenir une excellente posture. Il a fait la paix avec le climat anglais. Il a des sentiments forts vis-à-vis des chiens, qu'il garde pour lui. Son cache-œil reste parfaitement positionné. Tout va bien."
  next_title: "Ce qui vient ensuite"
  next_p1: "Nous quittons Albrighton début juin 2026. Après : ouvert. Nous pesons les options — un autre gardiennage, une location plus longue quelque part de plus chaud, ou quelque chose auquel nous n'avons pas encore pensé. La beauté et la terreur de cette vie, c'est que « la suite » est rarement décidée avant de l'être."
  next_p2: "L'Équateur est toujours à l'horizon. Toujours plus proche."
  updated_note: "Cette page a été mise à jour pour la dernière fois en"

