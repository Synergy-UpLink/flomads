# ── Home page ──────────────────────────────────────────────────
home:
  eyebrow: "⚓ desde 2020"
  headline_line1: "no<em>MADS</em>"
  headline_line2: "siguiendo"
  headline_line3: "el <em>FLUjo</em>"
  sub: "Dos personas, un erizo pirata y la carretera abierta — viajando a tiempo completo por el mundo, un cuidado de mascotas a la vez."
  strip_travelers: "🌍 Viajeros a tiempo completo"
  strip_liveaboards: "⛵ Ex residentes en barco"
  strip_petsitters: "🐾 TrustedHouseSitters"
  strip_finca: "🌿 Futuros agricultores en finca"
  what_title: "¿Qué es un Flomad?"
  what_p1: "Nos llamábamos FLOating noMADS — dos personas que vendieron la casa, se deshicieron de las cosas y se mudaron a un velero. Hoy el barco está en tierra, pero el espíritu sigue vivo: noMADS siguiendo el FLUjo."
  what_p2: "Desde 2020 hemos recorrido el planeta — cuidando mascotas a cambio de alojamiento, alquilando el tiempo suficiente para realmente <em>vivir</em> un lugar, y construyendo lentamente hacia una base permanente en una finca en Ecuador donde cultivar comida, hacer cosas con nuestras manos y albergar la comunidad que siempre quisimos."
  what_p3: "En el camino: aves, barcos, tallado en madera, tocar la armónica, copas en azoteas y un erizo llamado Henry."
  stat_years: "Años en la carretera"
  stat_destinations: "Países y destinos"
  stat_hedgehog: "Erizo pirata"
  stat_gnomes: "Gnomos dejados atrás"
  how_title: "Cómo lo hacemos"
  how_petsit_title: "Cuidado de mascotas"
  how_petsit_body: "Intercambiamos cuidados por alojamiento a través de TrustedHouseSitters. Perros, gatos, gallinas — los hemos amado a todos. Actualmente conviviendo con dos perros encantadores en el campo inglés."
  how_rental_title: "Alquileres a largo plazo"
  how_rental_body: "Preferimos quedarnos el tiempo suficiente para encontrar la buena cafetería, aprender los ritmos del barrio y sentirnos locales. Dos meses es el mínimo; más es mejor."
  how_sea_title: "Por mar (antes)"
  how_sea_body: "Pasamos años viviendo a bordo de un quéche Pearson 365, navegando la costa de Florida y pasando todo 2024 en las Bahamas. El capítulo del barco está terminando — pero la sal sigue en nosotros."
  how_remote_title: "Trabajo remoto"
  how_remote_body: "La consultoría tecnológica, la ingeniería de software y lo que el internet hace posible nos mantiene financiados y móviles. El wi-fi es imprescindible; el código de vestimenta, no."
  love_title: "Cosas que amamos"
  love_birding_title: "Observación de aves"
  love_birding_body: "Desde aves playeras de las Bahamas hasta petirrojos ingleses en postes de cerca — las aves están en todas partes si te detienes a mirar."
  love_carving_title: "Tallado en madera y piedra"
  love_carving_body: "Uno de nosotros talla gnomos, animales y figuras en madera y piedra. Los dejamos en cada cuidado — pequeños regalos para quien abra el cobertizo del jardín."
  love_harmonica_title: "Armónica"
  love_harmonica_body: "El otro está aprendiendo. Despacio. Sin constancia. Pero con gran entusiasmo."
  love_growing_title: "Cultivar"
  love_growing_body: "El juego largo es una finca — tierra, suelo, semillas y el tipo de autosuficiencia que se parece menos a prepararse para el apocalipsis y más al sentido común."
  love_rooftop_title: "Horas en la azotea"
  love_rooftop_body: "Copas en una terraza, una parrilla en el parque al atardecer, una mesa fuera de un mercado — así nos gusta socializar. Al aire libre, siempre."
  love_slowtravel_title: "Viaje lento"
  love_slowtravel_body: "No coleccionamos sellos en el pasaporte. Aprendemos hacia dónde va el sol por la tarde y qué panadería abre primero."
  cta_heading: "Únete al viaje."
  cta_body: "Todavía no tenemos un boletín (aún). Pero puedes saber dónde estamos ahora mismo y qué estamos haciendo."

# ── About page ─────────────────────────────────────────────────
about:
  title: "Sobre los Flomads"
  eyebrow: "La Tripulación"
  subtitle: "Tres almas. Caminos infinitos. Ninguna dirección fija."
  origin_title: "Cómo empezó"
  origin_p1: "En 2020, dos personas se miraron, miraron sus cosas y decidieron que las cuentas no cuadraban. El apartamento, el trayecto al trabajo, la acumulación — todo apuntaba a algo sin importancia. Así que lo empacaron todo en lo que cabía en bolsas, adquirieron un erizo Beanie Baby pirata de considerable dignidad, y se fueron."
  origin_p2: "El primer capítulo fue a flote. Vivieron a bordo de un quéche de 36 pies — un barco resistente y algo testarudo que recompensaba la paciencia y castigaba la complacencia. Aprendieron a fondear, a abastecerse, a enrollar cabos correctamente y a apreciar lo que significa tener un hogar que también tiene mareas. Las Bahamas en 2024 fueron el punto álgido: aguas cristalinas, estrellas absurdas y más aves playeras de las que podías nombrar antes del atardecer."
  origin_p3: "Cuando el capítulo del barco terminó, el camino continuó — Ecuador, Costa Rica, México, Vermont, de vuelta a Florida, y ahora Inglaterra. El ritmo es el mismo: encontrar un lugar, quedarse el tiempo suficiente para importar, y seguir adelante más rico por ello."
  crew_title: "Conoce a la Tripulación"
  navigator_title: "El Navegante"
  navigator_role: "Ingeniero de software · Consultor tecnológico · Estudiante de armónica (en progreso)"
  navigator_body: "Dos décadas de ingeniería de software, amor por resolver problemas en la intersección de la tecnología y la vida real, y una relación en curso con la armónica que se describe mejor como \"optimista\". Mantiene la tecnología funcionando, los barcos en movimiento y los itinerarios flexibles."
  henry_role: "Navegante Jefe · Oficial de Moral · Erizo Pirata"
  henry_body: "Un Beanie Baby de carácter impecable y temible reputación. Henry ha cruzado océanos, superado aduanas (filosóficamente hablando) y trae un aire de autoridad marítima dondequiera que se posta. No requiere alimentación. Excelente posando para fotos."
  admiral_title: "La Almirante"
  admiral_role: "Artista · Talladora · MXT · Compañera de 17 años"
  admiral_body: "Donde hay madera o piedra, eventualmente habrá un gnomo. La Almirante talla figuras en cada cuidado y las deja atrás — pequeños centinelas que vigilan jardines y estanterías mucho después de que los Flomads se hayan ido. También es excelente juzgando cuándo se merece una copa en la terraza (siempre)."
  history_title: "Dónde hemos estado"
  tl_2020_title: "Colorado Springs → La carretera"
  tl_2020_body: "El punto de origen. Empacamos, partimos y nunca miramos atrás."
  tl_ecuador_title: "Cuenca, Ecuador"
  tl_ecuador_body: "Cinco meses en los Andes. Alquiler a largo plazo, trabajo remoto y el primer sabor serio de \"quizás podríamos vivir aquí para siempre\"."
  tl_latam_title: "Costa Rica y México"
  tl_latam_body: "La Fortuna y Santa María de Dota en Costa Rica; Todos Santos, México. Junglas, volcanes y excelentes tacos."
  tl_liveaboard_title: "Los años a bordo"
  tl_liveaboard_body: "A bordo de un quéche Pearson 365 en Florida — anclando, en marinas y aprendiendo que el mar manda. Vermont también recibió una visita."
  tl_bahamas_title: "Las Bahamas"
  tl_bahamas_body: "Todo el año. Berry Islands. Exumas. Aguas del color de piscinas y cielos que hacían irrelevantes las discusiones."
  tl_florida_title: "Regreso a Florida y transición"
  tl_florida_body: "Melbourne, FL dos veces. La era del barco cierra; la era del cuidado de mascotas abre. Bolsas reempacadas, perfil de TrustedHouseSitters pulido."
  tl_england_title: "Inglaterra y más allá"
  tl_england_body: "Actualmente en el campo inglés con dos perros excelentes y un pub del pueblo a poca distancia. Próximo capítulo: por definir."
  dream_title: "El juego largo"
  dream_p1: "Los Flomads están construyendo hacia algo. No un regreso a la inmovilidad, sino un tipo diferente de arraigo — una finca en Ecuador, tierra para cultivar, una base permanente que también puede ser una comunidad. La ciudadanía ecuatoriana es el hilo burocrático; la granja sostenible es el sueño detrás de todo."
  dream_p2: "Mientras tanto, viajamos. Cuidamos los animales de otros y los tratamos como propios. Dejamos pequeñas figuras talladas en jardines. Estudiamos aves con binoculares y escalas de armónica con compromiso variable. Bebemos en terrazas, asamos en parques y nos quedamos el tiempo suficiente en cada lugar para tener un favorito."
  dream_p3: "Esa es la vida Flomad: no huir de nada. Corriendo <em>hacia</em> algo que se vuelve más interesante cuanto más nos acercamos."

# ── Now page ───────────────────────────────────────────────────
now:
  title: "Ahora"
  eyebrow: "📍 Actualizado en"
  subtitle: "Una instantánea de lo que estamos haciendo, dónde estamos y qué tenemos en mente."
  whats_now: "¿Qué es una página Now?"
  where_title: "Dónde estamos"
  where_highlight: "Albrighton, Shropshire, Inglaterra"
  where_p1: "Estamos en un pueblo del campo inglés para un cuidado que se extiende hasta principios de junio de 2026. Nuestros encargados: Trixie, una mezcla de bóxer con opinión sobre todo, y Buddy, un mestizo tipo labrador dorado que ha perfeccionado el arte de poner cara de pena a la hora de comer. Llegamos a principios de febrero y ya nos hemos integrado en los ritmos del pueblo — el pub, la oficina de correos, la calidad particular de la luz de la tarde entre los setos."
  where_p2: "Inglaterra en el paso del invierno a la primavera es más verde de lo que esperarías y gris de maneras que en realidad son hermosas. Las aves han sido excelentes."
  working_title: "En qué trabajamos"
  working_consulting_title: "Consultoría tecnológica"
  working_consulting_body: "Uno de nosotros mantiene las luces encendidas con ingeniería de software y consultoría tecnológica. Primero remoto, amigable con el asincrónico, ocasionalmente ruidoso al respecto."
  working_carving_title: "Tallado"
  working_carving_body: "La Almirante trabaja en madera — figuras y criaturas tomando forma lentamente en el banco de trabajo. Al menos una quedará aquí cuando nos vayamos."
  working_planning_title: "Planificando el próximo capítulo"
  working_planning_body: "Estamos investigando qué viene después de Inglaterra. El sueño de la finca siempre está en el fondo; el siguiente cuidado o alquiler es el primer plano. Ambos requieren hojas de cálculo."
  into_title: "Qué nos apasiona"
  into_learning_title: "🎵 Aprendiendo"
  into_learning_body: "La armónica. El progreso es… no lineal. Los perros tienen opiniones. Tocamos de todas formas."
  into_watching_title: "🦜 Observando"
  into_watching_body: "Aves, principalmente. Inglaterra tiene petirrojos inquietantemente amigables y chovas inquietantemente inteligentes."
  into_dreaming_title: "🌱 Soñando"
  into_dreaming_body: "Diseño de finca — qué crece bien en Ecuador, cómo es realmente la autosuficiencia a pequeña escala, qué tipo de comunidad queremos construir."
  henry_title: "Estado de Henry"
  henry_highlight: "Actualmente: dando audiencia en Shropshire"
  henry_body: "Henry S. Pricklesworth III sigue proyectando autoridad y manteniendo una excelente postura. Ha hecho las paces con el clima inglés. Tiene fuertes sentimientos sobre los perros, que mantiene en privado. Su parche en el ojo sigue perfectamente colocado. Todo está bien."
  next_title: "Qué sigue"
  next_p1: "Salimos de Albrighton a principios de junio de 2026. Después: abierto. Estamos sopesando opciones — otro cuidado, un alquiler más largo en algún lugar más cálido, o algo en lo que todavía no hemos pensado. La belleza y el terror de esta vida es que \"lo siguiente\" rara vez está decidido hasta que lo está."
  next_p2: "Ecuador siempre está en el horizonte. Siempre más cerca."
  updated_note: "Esta página fue actualizada por última vez en"

