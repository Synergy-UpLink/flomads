# ── Home page ──────────────────────────────────────────────────
home:
  eyebrow: "⚓ est. 2020"
  headline_line1: "no<em>MADS</em>"
  headline_line2: "going with"
  headline_line3: "the <em>FLO</em>"
  sub: "Two humans, one pirate hedgehog, and the open road — living full-time across the globe one petsit at a time."
  strip_travelers: "🌍 Full-Time Travelers"
  strip_liveaboards: "⛵ Former Liveaboards"
  strip_petsitters: "🐾 TrustedHouseSitters"
  strip_finca: "🌿 Future Finca Farmers"
  what_title: "What's a Flomad?"
  what_p1: "We used to call ourselves FLOating noMADS — two people who sold the house, shed the stuff, and moved aboard a sailboat. These days the boat's ashore, but the spirit lives on: noMADS going with the FLO."
  what_p2: "Since 2020 we've been threading our way across the planet — petsitting in exchange for a home, renting long enough to really <em>live</em> somewhere, and slowly building toward a permanent base on a finca in Ecuador where we can grow food, make things with our hands, and host the kind of community we've always wanted."
  what_p3: "Along the way: birds, boats, wood carving, harmonica noodling, rooftop drinks, and a hedgehog named Henry."
  stat_years: "Years on the Road"
  stat_destinations: "Countries & Destinations"
  stat_hedgehog: "Pirate Hedgehog"
  stat_gnomes: "Gnomes Left Behind"
  how_title: "How We Do It"
  how_petsit_title: "Petsitting"
  how_petsit_body: "We trade care for accommodation through TrustedHouseSitters. Dogs, cats, chickens — we've loved them all. Currently bunking with a pair of scruffy, lovable mutts in the English countryside."
  how_rental_title: "Long-Term Rentals"
  how_rental_body: "We prefer to stay put long enough to find the good coffee shop, learn the neighborhood rhythms, and feel like locals. Two months is a minimum; longer is better."
  how_sea_title: "By Sea (Formerly)"
  how_sea_body: "We spent years living aboard a Pearson 365 ketch, sailing the Florida coast and spending all of 2024 in the Bahamas. The boat chapter is closing — but the salt's still in us."
  how_remote_title: "Working Remotely"
  how_remote_body: "Tech consulting, software engineering, and whatever the internet makes possible keeps us funded and mobile. Wi-fi is a prerequisite; dress codes are not."
  love_title: "Things We Love"
  love_birding_title: "Birding"
  love_birding_body: "From Bahamian shorebirds to English robins perched on fence posts — birds are everywhere if you slow down enough to look."
  love_carving_title: "Wood & Stone Carving"
  love_carving_body: "One of us carves gnomes, animals, and figures from wood and stone. They get left behind at every sit — little gifts for the next person who opens the garden shed."
  love_harmonica_title: "Harmonica"
  love_harmonica_body: "The other one is learning. Slowly. Inconsistently. But with great enthusiasm."
  love_growing_title: "Growing Things"
  love_growing_body: "The long game is a finca — land, soil, seeds, and the kind of self-sufficiency that feels less like prepping and more like common sense."
  love_rooftop_title: "Rooftop Hours"
  love_rooftop_body: "Drinks on a terrace, a park grill at golden hour, a table outside a mercado — this is how we like to socialize. Al fresco, always."
  love_slowtravel_title: "Slow Travel"
  love_slowtravel_body: "We're not collecting passport stamps. We're learning where the sun goes in the afternoon and which bakery opens first."
  cta_heading: "Come along for the ride."
  cta_body: "We don't have a newsletter (yet). But you can find out where we are right now, and what we're up to."

# ── About page ─────────────────────────────────────────────────
about:
  title: "About the Flomads"
  eyebrow: "The Crew"
  subtitle: "Three souls. Infinite roads. Zero fixed addresses."
  origin_title: "How It Started"
  origin_p1: "In 2020, two people looked at each other, looked at their stuff, and decided the math didn't add up. The apartment, the commute, the accumulation — it was all pointing somewhere unremarkable. So they packed it down to what fit in bags, acquired a pirate hedgehog Beanie Baby of considerable dignity, and left."
  origin_p2: "The first chapter was afloat. They lived aboard a 36-foot ketch — a stalwart, slightly cantankerous vessel that rewarded patience and punished complacency. They learned to anchor, to provision, to coil lines properly, and to appreciate what it means to have a home that also has tides. The Bahamas in 2024 were the high point: glassy flats, absurd stars, and more shorebirds than you could name before sundown."
  origin_p3: "When the boat chapter wound down, the road continued — Ecuador, Costa Rica, Mexico, Vermont, back to Florida, and now England. The rhythm is the same: find a place, stay long enough to matter, then move on richer for it."
  crew_title: "Meet the Crew"
  navigator_title: "The Navigator"
  navigator_role: "Software Engineer · Tech Consultant · Harmonica Student (in progress)"
  navigator_body: "Two decades of software engineering, a love of solving problems at the intersection of technology and real life, and an ongoing relationship with the harmonica that can best be described as \"optimistic.\" Keeps the tech running, the boats moving, and the itineraries flexible."
  henry_role: "Chief Navigator · Morale Officer · Pirate Hedgehog"
  henry_body: "A Beanie Baby of impeccable character and fearsome reputation. Henry has crossed oceans, survived customs (philosophically speaking), and brings an air of maritime authority wherever he's posted. Does not require feeding. Excellent at posing for photos."
  admiral_title: "The Admiral"
  admiral_role: "Artist · Carver · MXT · Partner of 17 Years"
  admiral_body: "Where there is wood or stone, there will eventually be a gnome. The Admiral carves figures at every sit and leaves them behind — little sentinels watching over gardens and bookshelves long after the Flomads have moved on. Also an excellent judge of when a terrace drink is warranted (always)."
  history_title: "Where We've Been"
  tl_2020_title: "Colorado Springs → The Road"
  tl_2020_body: "The origin point. Packed up, shipped out, never looked back."
  tl_ecuador_title: "Cuenca, Ecuador"
  tl_ecuador_body: "Five months in the Andes. Long-term rental, remote work, and the first serious taste of \"maybe we could live here forever.\""
  tl_latam_title: "Costa Rica & Mexico"
  tl_latam_body: "La Fortuna and Santa Maria de Dota in Costa Rica; Todos Santos, Mexico. Jungles, volcanoes, and excellent tacos."
  tl_liveaboard_title: "The Liveaboard Years"
  tl_liveaboard_body: "Aboard a Pearson 365 ketch in Florida — anchoring, marinas, and learning that the sea is boss. Dorset, VT also got a visit."
  tl_bahamas_title: "The Bahamas"
  tl_bahamas_body: "The whole year. Berry Islands. Exumas. Flats the color of swimming pools and skies that made arguments irrelevant."
  tl_florida_title: "Return to Florida & Transition"
  tl_florida_body: "Melbourne, FL twice. The boat era closes; the petsitting era opens. Bags repacked, TrustedHouseSitters profile polished."
  tl_england_title: "England & Beyond"
  tl_england_body: "Currently in the English countryside with two excellent dogs and a village pub within walking distance. Next chapter: TBD."
  dream_title: "The Long Game"
  dream_p1: "The Flomads are building toward something. Not a return to stasis, but a different kind of rootedness — a finca in Ecuador, land to grow food on, a permanent base that can also be a community. Ecuadorian citizenship is the bureaucratic thread; the sustainable farm is the dream behind it."
  dream_p2: "In the meantime, we travel. We sit with other people's animals and treat them like our own. We leave small carved figures in gardens. We study birds with binoculars and harmonica scales with varying commitment. We drink on terraces and grill in parks and stay long enough in each place to have a favorite."
  dream_p3: "That's the Flomad life: not running away from anything. Running <em>toward</em> something that keeps getting more interesting the closer we get."

# ── Now page ───────────────────────────────────────────────────
now:
  title: "Now"
  eyebrow: "📍 Updated"
  subtitle: "A snapshot of what we're doing, where we are, and what's on our minds."
  whats_now: "What's a now page?"
  where_title: "Where We Are"
  where_highlight: "Albrighton, Shropshire, England"
  where_p1: "We're tucked into a village in the English countryside for a petsit running through early June 2026. Our charges: Trixie, a boxer mix with an opinion about everything, and Buddy, a golden-lab-ish mutt who has perfected the art of looking pitiful at mealtimes. We arrived in early February and have fully settled into the rhythms of the village — the pub, the post office, the particular quality of afternoon light through hedgerows."
  where_p2: "England in winter-into-spring is greener than you'd expect and grey in ways that are actually beautiful. The birds have been excellent."
  working_title: "What We're Working On"
  working_consulting_title: "Tech Consulting"
  working_consulting_body: "One of us keeps the lights on with software engineering and technology consulting work. Remote-first, async-friendly, occasionally loud about it."
  working_carving_title: "Carving"
  working_carving_body: "The Admiral is working in wood — figures and creatures taking shape slowly on the workbench. At least one will be left behind here when we go."
  working_planning_title: "Planning the Next Chapter"
  working_planning_body: "We're researching what comes after England. The finca dream is always in the background; the next sit or rental is the foreground. Both require spreadsheets."
  into_title: "What We're Into"
  into_learning_title: "🎵 Learning"
  into_learning_body: "The harmonica. Progress is… nonlinear. The dogs have opinions. We play anyway."
  into_watching_title: "🦜 Watching"
  into_watching_body: "Birds, mostly. England has robins that are disturbingly friendly and jackdaws that are disturbingly smart."
  into_dreaming_title: "🌱 Dreaming"
  into_dreaming_body: "Finca design — what grows well in Ecuador, what self-sufficiency actually looks like at small scale, what kind of community we want to build."
  henry_title: "Henry's Status"
  henry_highlight: "Currently: Holding Court in Shropshire"
  henry_body: "Henry S. Pricklesworth III continues to project authority and maintain excellent posture. He has made peace with the English climate. He has strong feelings about the dogs, which he keeps private. His eyepatch remains perfectly positioned. All is well."
  next_title: "What's Next"
  next_p1: "We depart Albrighton in early June 2026. After that: open. We're weighing options — another petsit, a longer rental somewhere warmer, or something we haven't thought of yet. The beauty and terror of this life is that \"next\" is rarely locked in until it is."
  next_p2: "Ecuador is always on the horizon. Always getting closer."
  updated_note: "This page was last updated in"

