{%- assign post = include.post -%}
<article class="collection-item collection-row" data-tags="{% for tag in post.tags %}{{ tag | slugify }} {% endfor %}">
  <time class="collection-row-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
  <h2 class="collection-row-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  {% if post.location %}<span class="collection-row-location">📍 {{ post.location }}</span>{% endif %}
</article>
