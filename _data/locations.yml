# ── Locations ────────────────────────────────────────────────
# One entry per physical place
# Fields:
#   id:           unique slug
#   name:         display name (kept intentionally general in a
#                 couple of spots — e.g. "Space Coast, FL" instead
#                 of the exact town — to avoid pinpointing exactly
#                 where homeowners live)
#   country:      country name
#   flag:         emoji flag
#   lat/lng:      coordinates, used by the map marker. Kept to 2 decimal
#                 places (about 1 km) on purpose: the map is public, so
#                 use a town or city centre, never an exact address
#   description:  general geographic description of the PLACE
#                 itself (facts about the location — not a
#                 personal account of a specific stay there;
#                 that belongs on the visit's `blurb` instead)

locations:
  - id: hanoi-vietnam
    name: "Hà Nội, Vietnam"
    country: "Vietnam"
    flag: "🇻🇳"
    lat: 21.08
    lng: 105.81
    description: "The capital of Vietnam, in the north of the country on the Red River delta. A city of more than a thousand years, it combines the narrow streets of the Old Quarter, French colonial boulevards, and centuries-old temples and pagodas with a cityscape of lakes, including Hoàn Kiếm Lake in the centre and the much larger West Lake (Hồ Tây) to the north. Known for its street food, egg coffee, and dense motorbike traffic."

  - id: bangkok-thailand
    name: "Bangkok, Thailand"
    country: "Thailand"
    flag: "🇹🇭"
    lat: 13.75
    lng: 100.57
    description: "Bangkok, the capital of Thailand, is a vibrant metropolis known for its ornate shrines, bustling street life, and floating markets along the Chao Phraya River. It serves as a major gateway to Southeast Asia, blending rich cultural heritage with modern urban energy."

  - id: ris-orangis-fr
    name: "Ris-Orangis, France"
    country: "France"
    flag: "🇫🇷"
    lat: 48.65
    lng: 2.39
    description: "Ris-Orangis is a commune in the Essonne department, about 25 kilometers southeast of Paris and part of the Paris metropolitan area. It is known for its residential neighborhoods, parks, and transport links. The town combines suburban amenities with a long history dating back to the medieval period."

  - id: paris-fr
    name: "Paris, France"
    country: "France"
    flag: "🇫🇷"
    lat: 48.86
    lng: 2.35
    description: "The capital of France, in the Île-de-France region on the banks of the Seine River. Home to global landmarks like the Eiffel Tower, Notre-Dame, and the Louvre, and one of the most visited cities in the world."

  - id: limoges-fr
    name: "Limoges, France"
    country: "France"
    flag: "🇫🇷"
    lat: 45.84
    lng: 1.26
    description: "A city in the Haute-Vienne department of France's Nouvelle-Aquitaine region, on the banks of the Vienne River. Renowned since the 18th century for its fine porcelain."

  - id: albi-fr
    name: "Albi, France"
    country: "France"
    flag: "🇫🇷"
    lat: 43.89
    lng: 5.73
    description: "A city in the Tarn department of southern France's Occitanie region, on the banks of the Tarn River. Its brick-built old town and cathedral form the Cité Épiscopale, a UNESCO World Heritage Site."

  - id: south-benfleet-uk
    name: "South Benfleet"
    country: "England, UK"
    flag: "🇬🇧"
    lat: 51.56
    lng: 0.54
    description: "A town in the Castle Point district of Essex, England, on the edge of the Thames Estuary marshes northeast of London."

  - id: romford-uk
    name: "Romford"
    country: "England, UK"
    flag: "🇬🇧"
    lat: 51.57
    lng: 0.18
    description: "A town in the London Borough of Havering, on the eastern edge of Greater London — historically a market town, now a suburban hub with rail links into central London."

  - id: albrighton-uk
    name: "Albrighton, Shropshire"
    country: "England, UK"
    flag: "🇬🇧"
    lat: 52.64
    lng: -2.28
    description: "A village in Shropshire, England, a few miles northeast of Telford and Wolverhampton in the West Midlands countryside."

  - id: colorado-springs-us
    name: "Colorado Springs, CO"
    country: "United States"
    flag: "🇺🇸"
    lat: 38.88
    lng: -104.92
    description: "A city in El Paso County, Colorado, at the eastern foot of Pikes Peak in the Rocky Mountains, roughly 60 miles south of Denver."

  - id: cancun-mx
    name: "Cancun, MX"
    country: "Mexico"
    flag: "🇲🇽"
    lat: 21.12
    lng: -86.94
    description: "A resort city on the northeastern tip of Mexico's Yucatán Peninsula, in Quintana Roo, fronting the Caribbean Sea."

  - id: todos-santos-mx
    name: "Todos Santos, Baja California Sur"
    country: "Mexico"
    flag: "🇲🇽"
    lat: 23.46
    lng: -110.26
    description: "A small town on the Pacific coast of the Baja California Sur peninsula, midway between Cabo San Lucas and La Paz — designated a Pueblo Mágico for its arts and surf culture."

  - id: cuenca-ec
    name: "Cuenca, EC"
    country: "Ecuador"
    flag: "🇪🇨"
    lat: -2.89
    lng: -79.03
    description: "A colonial-era city in the Andean highlands of Ecuador's Azuay Province, roughly 2,500 meters above sea level. Its historic center is a UNESCO World Heritage Site."

  - id: santa-maria-de-dota-cr
    name: "Santa María de Dota"
    country: "Costa Rica"
    flag: "🇨🇷"
    lat: 9.59
    lng: -84.04
    description: "A mountain town in Costa Rica's Los Santos region, in the Talamanca foothills south of San José, known as one of the country's premier coffee-growing areas."

  - id: exuma-bs
    name: "Exuma, BS"
    country: "Bahamas"
    flag: "🇧🇸"
    lat: 24.11
    lng: -76.80
    description: "An archipelago in the Bahamas southeast of Nassau, made up of over 365 small cays known for shallow turquoise water and the swimming pigs of Big Major Cay."

  - id: la-fortuna-cr
    name: "La Fortuna, CR"
    country: "Costa Rica"
    flag: "🇨🇷"
    lat: 10.47
    lng: -85.05
    description: "A town in Costa Rica's Alajuela Province, at the base of the (currently dormant) Arenal Volcano in the country's northern lowlands."

  - id: manchester-vt
    name: "Manchester, VT"
    country: "United States"
    flag: "🇺🇸"
    lat: 43.17
    lng: -73.11
    description: "A town in Bennington County, Vermont, in the Green Mountains, historically a resort town for hiking, skiing, and fly-fishing."

  - id: space-coast-fl
    name: "Space Coast, FL"
    country: "United States"
    flag: "🇺🇸"
    lat: 28.19
    lng: -80.57
    description: "The stretch of Florida's Atlantic coast in Brevard County, named for its proximity to Kennedy Space Center and Cape Canaveral."

  - id: fort-lauderdale-fl
    name: "Fort Lauderdale, FL"
    country: "United States"
    flag: "🇺🇸"
    lat: 26.14
    lng: -80.23
    description: "A city on Florida's southeastern coast in Broward County, known for its extensive canal system and marine industry — a common jumping-off point for the Bahamas."

# ── Visits ───────────────────────────────────────────────────
# Flat list (not nested under locations) so it can be sorted
# chronologically regardless of entry order, and so a location
# can rack up multiple non-contiguous visits over time.
#
# Fields:
#   id:           unique slug. Sit-type visits use the SAME id as
#                 the matching entry in sits.yml — that shared id
#                 IS the foreign key, no separate field needed.
#   location_id:  which location (see above)
#   type:         sit | rental | sailing | vacation | home_base
#                 (freeform — add types as needed)
#   start / end:  YYYY-MM-DD when known. Leave "" if unknown/TBD.
#   label:        optional human-readable override for display
#                 (e.g. "2025 (two stays)") when start/end alone
#                 doesn't tell the right story. Falls back to
#                 start/end if blank.
#   current:      true = this is the present-day visit
#   blurb:        optional short note about this specific stay

visits:

  - id: colorado-springs-home
    location_id: colorado-springs-us
    type: home_base
    start: "2009-01-01"
    end: "2019-01-01"
    label: "2009 - 2019"
    current: false
    blurb: "A decade in one place before the leap into full-time travel."

