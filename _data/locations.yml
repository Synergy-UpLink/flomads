# ── Locations ────────────────────────────────────────────────
# One entry per physical place. Coordinates copied over from the
# old hardcoded now_map.html markers (now the single source of
# truth for lat/lng — now_map.html, sits.yml, and profile/index.html
# all read from here instead of each keeping their own copy).
#
# Fields:
#   id:           unique slug
#   name:         display name (kept intentionally general in a
#                 couple of spots — e.g. "Space Coast, FL" instead
#                 of the exact town — to avoid pinpointing exactly
#                 where homeowners live)
#   country:      country name
#   flag:         emoji flag
#   lat/lng:      coordinates, used by the map marker
#   description:  optional short blurb about the PLACE itself
#                 (not any specific stay there)

