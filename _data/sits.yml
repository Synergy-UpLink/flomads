# ── Standalone testimonials ──────────────────────────────────
# For reviews NOT tied to a documented sit above (e.g. an extra
# TrustedHouseSitters/Nomador review, or a sit you haven't
# written up yet). If a testimonial already lives on a sit's
# `testimonial:` field, don't duplicate it here — the Profile
# page pulls sit-linked testimonials automatically.
testimonials:
  - quote: "I've known Christine for over 25 years. She has watched my house and pets (cats and birds) numerous times. She's caring, clean and trustworthy!! Five stars all around!! I have also seen how well she treated her own pets and home over the years. I am extremely comfortable handing her my house keys and not worrying about my home. I know my pets will be loved and well taken care of!!"
    name: "Heather"
    location: "Colorado Springs, CO, USA"
    platform: "Direct"

  - quote: "Christine is great with my cats! They are always happy to see her, and she actually leaves my house cleaner than when she came! She always shows up when she says she will and treats my babies like they are her own."
    name: "Stephanie"
    location: "Reference from a family member"
    platform: "TrustedHouseSitters"

  - quote: "Christine is a former boss and years long friend. She is a very smart responsible trustworthy and caring person. She would be a wonderful option to take care of your pets as she had some of her own in the past."
    name: "Sheila"
    location: "Reference from a colleague"
    platform: "TrustedHouseSitters"

  - quote: "Christine was awesome. I would highly recommend her for your pet/house services. Super nice, responsible, respectful, incredibly professional, and very caring. If she's not on the top of your list, you're doing it wrong."
    name: "Dustin"
    location: "Home & pet sitting reference"
    platform: "TrustedHouseSitters"