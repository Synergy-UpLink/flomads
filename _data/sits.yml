# ── Sits ─────────────────────────────────────────────────────
# Location/dates/lat/lng live in _data/locations.yml. Each sit's
# `id` here must match a visit `id` there — that's the whole
# link, no separate foreign-key field needed. Visit-level `blurb`
# in locations.yml covers general context for the sit (e.g. no
# public review yet); there's no top-level `notes` field here.
#
# Fields:
#   id:           unique slug — MUST match a visit id in locations.yml
#   owners:       first names of the homeowners
#   testimonial:
#     quote:      their words (no surrounding quotes needed)
#     name:       how they want to be credited
#   photos:       array of 1-2 image paths (relative to
#                 /assets/images/sits/) about the sit generally.
#                 A second photo is only added when the weather
#                 changed enough to be worth an arrival-vs-
#                 departure comparison (cross-fade on hover).
#   animals:      list of animal profiles (see schema below)
#
# Animal fields:
#   name, species, breed — required
#   age                  — optional
#   photo                — path under /assets/images/sits/
#   notes                — optional; used as the photo's hover/alt
#                          text or caption. If blank, generate one
#                          from the other animal fields at display time.

